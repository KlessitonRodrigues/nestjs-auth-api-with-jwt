swagger: '2.0'
info:
  title: Authentication API
  description: |
    Swagger 2.0 specification for the authentication-api service
  version: '1.0.0'
host: localhost:3005
basePath: /
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json

paths:
  /:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Successful response with greeting text.
          schema:
            type: string
          examples:
            application/json: Hello World!

  /auth/signin:
    post:
      tags:
        - Auth
      summary: Sign in user
      operationId: signIn
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SignInRequest'
      responses:
        '200':
          description: Successful sign-in response.
          schema:
            $ref: '#/definitions/SignInResponse'
          examples:
            application/json:
              accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              email: jane@example.com
              name: Jane Doe
        '400':
          description: Invalid request body.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Invalid email or password.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: Invalid credentials
              code: invalid_credentials
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /auth/signup:
    post:
      tags:
        - Auth
      summary: Sign up new user
      operationId: signUp
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SignUpRequest'
      responses:
        '201':
          description: User created successfully.
          schema:
            $ref: '#/definitions/SuccessResponse'
          examples:
            application/json:
              message: Created successfully
              code: created_successfully
        '400':
          description: Invalid request body or the email is already registered.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: User already exists
              code: user_already_exists
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /auth/signout:
    post:
      tags:
        - Auth
      summary: Sign out user
      operationId: signOut
      responses:
        '200':
          description: Successful sign-out response. The auth cookie is cleared.
          schema:
            $ref: '#/definitions/SuccessResponse'
          headers:
            Set-Cookie:
              type: string
              description: Expired token cookie.
          examples:
            application/json:
              message: Signed out successfully
              code: signed_out_successfully
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      operationId: refreshToken
      description: |
        Accepts the token in the request body or in the auth token cookie.
        Returns a new access token and sets it as a cookie.
      parameters:
        - in: body
          name: body
          required: false
          schema:
            $ref: '#/definitions/TokenRequest'
      responses:
        '200':
          description: Token refreshed successfully.
          schema:
            $ref: '#/definitions/RefreshTokenResponse'
          headers:
            Set-Cookie:
              type: string
              description: Newly issued token cookie.
          examples:
            application/json:
              accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              user:
                userId: 8f8a0f0e-5a2b-4f63-9f12-2f4d5c6e7a8b
                email: jane@example.com
                name: Jane Doe
        '400':
          description: Missing token.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: Invalid token
              code: invalid_token
        '401':
          description: Invalid or expired token.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: Expired token
              code: expired_token
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /auth/send-code:
    post:
      tags:
        - Auth
      summary: Send password recovery code to email
      operationId: sendRecoveryCode
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/EmailRequest'
      responses:
        '200':
          description: Recovery code generated successfully.
          schema:
            $ref: '#/definitions/RecoveryCodeResponse'
          examples:
            application/json:
              recoveryCode: '123456'
        '400':
          description: Invalid request body.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: User not found.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: User not found
              code: user_not_found
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /auth/verify-code:
    post:
      tags:
        - Auth
      summary: Verify password recovery code
      operationId: verifyRecoveryCode
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/VerifyRecoveryCodeRequest'
      responses:
        '200':
          description: Recovery code verified successfully. Returns a short-lived reset token.
          schema:
            $ref: '#/definitions/VerifyRecoveryCodeResponse'
          examples:
            application/json:
              token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Invalid request body.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Invalid or expired recovery code.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: Invalid token
              code: invalid_token
        '404':
          description: User not found.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset user password
      operationId: resetPassword
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully.
          schema:
            $ref: '#/definitions/SuccessResponse'
          examples:
            application/json:
              message: Password reset successfully
              code: password_reset_successfully
        '400':
          description: Invalid request body.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Invalid or expired reset token.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: Expired token
              code: expired_token
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /auth/google:
    post:
      tags:
        - Auth
      summary: Sign in with Google
      operationId: googleSignIn
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/TokenRequest'
      responses:
        '200':
          description: Successful Google sign-in response.
          schema:
            $ref: '#/definitions/GoogleSignInResponse'
          examples:
            application/json:
              accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              userId: 8f8a0f0e-5a2b-4f63-9f12-2f4d5c6e7a8b
              email: jane@example.com
              name: Jane Doe
        '400':
          description: Invalid request body.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Google account has no verified email.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: No verified email found
              code: no_verified_email
        '500':
          description: Failed to fetch Google user information or internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: Failed to fetch user info
              code: failed_to_fetch_user_info

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      operationId: findAllUsers
      responses:
        '200':
          description: List of users.
          schema:
            type: array
            items:
              $ref: '#/definitions/User'
          examples:
            application/json:
              - id: 8f8a0f0e-5a2b-4f63-9f12-2f4d5c6e7a8b
                name: Jane Doe
                email: jane@example.com
                createdAt: '2026-10-21T10:00:00.000Z'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'
    post:
      tags:
        - Users
      summary: Create a new user
      operationId: createUser
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateUserRequest'
      responses:
        '201':
          description: User created successfully.
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              id: 8f8a0f0e-5a2b-4f63-9f12-2f4d5c6e7a8b
              name: Jane Doe
              email: jane@example.com
              createdAt: '2026-10-21T10:00:00.000Z'
        '400':
          description: Invalid request body or the email is already registered.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: findOneUser
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
      responses:
        '200':
          description: User found.
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              id: 8f8a0f0e-5a2b-4f63-9f12-2f4d5c6e7a8b
              name: Jane Doe
              email: jane@example.com
              createdAt: '2026-10-21T10:00:00.000Z'
        '404':
          description: User not found.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'
    put:
      tags:
        - Users
      summary: Update user by ID
      operationId: updateUser
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateUserRequest'
      responses:
        '200':
          description: User updated successfully.
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              id: 8f8a0f0e-5a2b-4f63-9f12-2f4d5c6e7a8b
              name: Jane Doe
              email: jane@example.com
              createdAt: '2026-10-21T10:00:00.000Z'
        '400':
          description: Invalid request body.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: User not found.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'
    patch:
      tags:
        - Users
      summary: Partially update user by ID
      operationId: patchUser
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/CreateUserRequest'
      responses:
        '200':
          description: User patched successfully.
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              id: 8f8a0f0e-5a2b-4f63-9f12-2f4d5c6e7a8b
              name: Jane Doe
              email: jane@example.com
              createdAt: '2026-10-21T10:00:00.000Z'
        '400':
          description: Invalid request body.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: User not found.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'
    delete:
      tags:
        - Users
      summary: Delete user by ID
      operationId: deleteUser
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
      responses:
        '200':
          description: User deleted successfully.
          schema:
            $ref: '#/definitions/DeleteResponse'
          examples:
            application/json:
              message: Deleted successfully
              code: deleted_successfully
        '404':
          description: User not found.
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Internal server error.
          schema:
            $ref: '#/definitions/ErrorResponse'

definitions:
  SignInRequest:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
        example: jane@example.com
      password:
        type: string
        minLength: 8
        example: Password123!

  SignInResponse:
    type: object
    required:
      - accessToken
      - email
      - name
    properties:
      accessToken:
        type: string
        description: Signed JWT access token, valid for 1 hour.
      email:
        type: string
        format: email
      name:
        type: string

  SignUpRequest:
    type: object
    required:
      - name
      - email
      - password
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
        example: Jane Doe
      email:
        type: string
        format: email
        example: jane@example.com
      password:
        type: string
        minLength: 8
        example: Password123!

  TokenRequest:
    type: object
    required:
      - token
    properties:
      token:
        type: string
        minLength: 1
        description: |
          JWT access token for /auth/refresh-token, or Google OAuth access token
          for /auth/google. On /auth/refresh-token the token may also be supplied
          through the auth token cookie instead of the body.

  RefreshTokenResponse:
    type: object
    required:
      - accessToken
      - user
    properties:
      accessToken:
        type: string
        description: Newly signed JWT access token, valid for 1 hour.
      user:
        $ref: '#/definitions/UserClaims'

  UserClaims:
    type: object
    required:
      - userId
      - email
      - name
    properties:
      userId:
        type: string
        format: uuid
      email:
        type: string
        format: email
      name:
        type: string

  GoogleSignInResponse:
    type: object
    required:
      - accessToken
      - userId
      - email
      - name
    properties:
      accessToken:
        type: string
        description: Signed JWT access token, valid for 1 hour.
      userId:
        type: string
        format: uuid
      email:
        type: string
        format: email
      name:
        type: string

  EmailRequest:
    type: object
    required:
      - email
    properties:
      email:
        type: string
        format: email
        example: jane@example.com

  VerifyRecoveryCodeRequest:
    type: object
    required:
      - email
      - code
    properties:
      email:
        type: string
        format: email
        example: jane@example.com
      code:
        type: string
        minLength: 6
        maxLength: 6
        example: '123456'

  RecoveryCodeResponse:
    type: object
    required:
      - recoveryCode
    properties:
      recoveryCode:
        type: string
        description: Six digit password recovery code, valid for 15 minutes.
        example: '123456'

  VerifyRecoveryCodeResponse:
    type: object
    required:
      - token
    properties:
      token:
        type: string
        description: Short-lived JWT reset token, valid for 15 minutes.

  ResetPasswordRequest:
    type: object
    required:
      - token
      - newPassword
    properties:
      token:
        type: string
        description: Reset token returned by /auth/verify-code.
      newPassword:
        type: string
        minLength: 8
        example: NewPassword456!

  CreateUserRequest:
    type: object
    required:
      - name
      - email
      - password
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 200
        example: Jane Doe
      email:
        type: string
        format: email
        example: jane@example.com
      password:
        type: string
        minLength: 8
        example: Password123!

  User:
    type: object
    required:
      - id
      - name
      - email
      - createdAt
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      email:
        type: string
        format: email
      createdAt:
        type: string
        format: date-time

  SuccessResponse:
    type: object
    required:
      - message
    properties:
      message:
        type: string
      code:
        type: string
      data: {}

  ErrorResponse:
    type: object
    required:
      - message
    properties:
      message:
        type: string
      code:
        type: string
      details: {}

  DeleteResponse:
    type: object
    required:
      - message
    properties:
      message:
        type: string
      code:
        type: string
